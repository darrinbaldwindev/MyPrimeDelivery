name: Fixture validation

on:
  push:
    branches:
      - agent/overseer/initial-project-timeline
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-m03-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate M-03 synthetic fixture
        run: python fixtures/m03/validate_fixture.py fixtures/m03/prime-discovery.synthetic.json
      - name: Run fail-closed fixture tests
        run: python -m unittest fixtures/m03/test_validate_fixture.py
      - name: Render synthetic component projection
        run: python fixtures/m03/render_fixture.py fixtures/m03/prime-discovery.synthetic.json
      - name: Run fail-closed render tests
        run: python -m unittest fixtures/m03/test_render_fixture.py
      - name: Validate synthetic deal evidence fixture
        run: python fixtures/deals/validate_deal_fixture.py fixtures/deals/deal-evidence.synthetic.json
      - name: Render fail-closed deal projection
        run: python fixtures/deals/render_deal_fixture.py fixtures/deals/deal-evidence.synthetic.json
      - name: Run deal evidence negative assurance tests
        run: python -m unittest discover -s fixtures/deals -p 'test_*.py'
      - name: Validate first-100 candidate research dataset
        run: python fixtures/candidates/validate_candidate_research.py fixtures/candidates/first-100-research.json
      - name: Validate Batch 004 candidate research tranche
        run: python fixtures/candidates/validate_candidate_research.py fixtures/candidates/research-tranche-004.json
      - name: Validate Batch 005 candidate research tranche
        run: python fixtures/candidates/validate_candidate_research.py fixtures/candidates/research-tranche-005.json
      - name: Run candidate research negative assurance tests
        run: python -m unittest discover -s fixtures/candidates -p 'test_*.py'
